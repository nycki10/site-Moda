<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia de Modelagem | Ateliê & Linha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/molde.css">
</head>

<body>
    <div class="pagina">
        <header>
            <div class="laco esquerdo">🎀</div>
            <h1>✂️ Guia de Modelagem de Moda</h1>
            <p>Ateliê & Linha • Guia de Estudos para Costura</p>
            <div class="laco direito">🎀</div>
        </header>

        <section class="decoracao">
            <div class="maquina">🪡</div>
            <div class="linha"></div>
        </section>

        <div class="grade">
            <!-- CARD 1 -->

            <section class="card">
                <h2>📏 Linhas</h2>

                <ul>
                    <li>
                        <label>
                            <input type="checkbox">
                            <span>Reta</span>
                        </label>
                    </li>

                    <li>

                        <label>
                            <input type="checkbox">
                            <span>Curva</span>
                        </label>
                    </li>

                    <li>
                        <label>
                            <input type="checkbox">
                            <span>Espiral</span>
                        </label>
                    </li>

                    <li>
                        <label>
                            <input type="checkbox">
                            <span>Tracejada</span>
                        </label>
                    </li>

                    <li>
                        <label>
                            <input type="checkbox">
                            <span>Zigue-zague</span>
                        </label>
                    </li>
                </ul>
            </section>

            <!-- CARD 2 -->

            <section class="card">
                <h2>👗 Croqui</h2>

                <div class="croqui">
                    <div class="cabeca"></div>
                    <div class="tronco"></div>
                    <div class="braco esquerdo"></div>
                    <div class="braco direito"></div>
                    <div class="perna esquerda"></div>
                    <div class="perna direita"></div>
                </div>
            </section>

            <!-- CARD 3 -->

            <section class="card">
                <h2>👗 Saias</h2>

                <ul>
                    <li><label><input type="checkbox"><span>Evasê</span></label></li>
                    <li><label><input type="checkbox"><span>Godê</span></label></li>
                    <li><label><input type="checkbox"><span>Lápis</span></label></li>
                    <li><label><input type="checkbox"><span>Plissada</span></label></li>
                    <li><label><input type="checkbox"><span>Envelope</span></label></li>
                </ul>
            </section>

            <!-- CARD 4 -->

            <section class="card">
                <h2>🧵 Tecidos</h2>

                <ul>
                    <li><label><input type="checkbox"><span>Algodão</span></label></li>
                    <li><label><input type="checkbox"><span>Linho</span></label></li>
                    <li><label><input type="checkbox"><span>Seda</span></label></li>
                    <li><label><input type="checkbox"><span>Jeans</span></label></li>
                    <li><label><input type="checkbox"><span>Malha</span></label></li>
                </ul>
            </section>

            <!-- CARD 5 -->

            <section class="card">
                <h2>👤 Silhuetas</h2>

                <ul>
                    <li><label><input type="checkbox"><span>Ampulheta</span></label></li>
                    <li><label><input type="checkbox"><span>Oval</span></label></li>
                    <li><label><input type="checkbox"><span>Retângulo</span></label></li>
                    <li><label><input type="checkbox"><span>Triângulo</span></label></li>
                    <li><label><input type="checkbox"><span>Triângulo Invertido</span></label></li>
                </ul>
            </section>

            <!-- CARD 6 -->

            <section class="card">
                <h2>🎨 Círculo de Cores</h2>

                <div class="cores">
                    <div class="cor vermelho"></div>
                    <div class="cor laranja"></div>
                    <div class="cor amarelo"></div>
                    <div class="cor verde"></div>
                    <div class="cor azul"></div>
                    <div class="cor roxo"></div>
                    <div class="centro"></div>
                </div>
            </section>
