<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ateliê & Linha - Login / Cadastro</title>
    <link rel="stylesheet" href="../css/login.css">
    <!-- Scripts da Aplicação -->
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
</head>
<body>

    <div style="max-width: 900px; margin: 20px auto 0 auto;">
        <a href="../index.html" class="btn-voltar" style="display: inline-flex; align-items: center; gap: 6px; color: #b56c6c; text-decoration: none; font-weight: 600; font-size: 14px; background: #fff0f3; padding: 8px 18px; border-radius: 20px; border: 1px solid #f4d7de;">← Voltar ao Catálogo</a>
    </div>

    <div class="login-container">
        <!-- Lado Esquerdo: Identidade Visual -->
        <div class="login-banner">
            <h2>🧵 Ateliê & Linha</h2>
            <p>Seu espaço de trabalho digital organizado para costura, modelagem e criação por IA.</p>
        </div>

        <!-- Lado Direito: Formulário Dinâmico -->
        <div class="login-box">
            <!-- Abas para alternar entre Login e Cadastro -->
            <div class="abas-login">
                <button class="aba-btn ativa" onclick="alternarFormulario('login')">Entrar</button>
                <button class="aba-btn" onclick="alternarFormulario('cadastro')">Criar Conta</button>
            </div>

            <!-- Formulário de Login -->
            <form id="form-login" class="form-login active">
                <div class="campo-grupo">
                    <label for="email-login">E-mail Profissional</label>
                    <input type="email" id="email-login" required placeholder="exemplo@atelie.com">
                </div>
                <div class="campo-grupo">
                    <label for="senha-login">Sua Senha</label>
                    <input type="password" id="senha-login" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-acesso" id="btn-submit-login">Acessar Painel</button>
                <a href="#" class="link-esqueceu" onclick="alert('Instruções de recuperação enviadas para o seu e-mail!'); return false;">Esqueceu a senha?</a>
            </form>

            <!-- Formulário de Cadastro -->
            <form id="form-cadastro" class="form-login">
                <div class="campo-grupo">
                    <label for="nome-cadastro">Nome Completo / Ateliê</label>
                    <input type="text" id="nome-cadastro" required placeholder="Ex: Maria Silva Costura">
                </div>
                <div class="campo-grupo">
                    <label for="email-cadastro">E-mail</label>
                    <input type="email" id="email-cadastro" required placeholder="seuemail@provedor.com">
                </div>
                <div class="campo-grupo">
                    <label for="senha-cadastro">Criar Senha</label>
                    <input type="password" id="senha-cadastro" required placeholder="Mínimo 6 caracteres">
                </div>
                <button type="submit" class="btn-acesso" id="btn-submit-cadastro">Criar Minha Conta no Ateliê</button>
            </form>
        </div>
    </div>

    <script>
        function alternarFormulario(tipo) {
            const formLogin = document.getElementById('form-login');
            const formCadastro = document.getElementById('form-cadastro');
            const botoes = document.querySelectorAll('.aba-btn');
    
            if (tipo === 'login') {
                formLogin.classList.add('active');
                formCadastro.classList.remove('active');
                botoes[0].classList.add('ativa');
                botoes[1].classList.remove('ativa');
            } else {
                formLogin.classList.remove('active');
                formCadastro.classList.add('active');
                botoes[0].classList.remove('ativa');
                botoes[1].classList.add('ativa');
            }
        }
    
        // Login via API (Express/MySQL) com fallback
        document.getElementById("form-login").addEventListener("submit", async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-login');
            btn.disabled = true;
            btn.textContent = "Conectando...";

            const email = document.getElementById('email-login').value;
            const senha = document.getElementById('senha-login').value;
            
            const res = await realizarLoginAPI(email, senha);
            if (res.ok) {
                const u = res.user;
                alert(`Seja bem-vindo(a) de volta, ${u.nome || email}!`);
                window.location.href = "../index.html";
            } else {
                alert('Erro ao realizar login. Tente novamente.');
                btn.disabled = false;
                btn.textContent = "Acessar Painel";
            }
        });
    
        // Cadastro via API (Express/MySQL com role: 'user') com fallback
        document.getElementById("form-cadastro").addEventListener("submit", async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-cadastro');
            btn.disabled = true;
            btn.textContent = "Criando conta...";

            const nome = document.getElementById('nome-cadastro').value || "Costureira";
            const email = document.getElementById('email-cadastro').value;
            const senha = document.getElementById('senha-cadastro').value;
            
            const res = await realizarCadastroAPI(nome, email, senha);
            if (res.ok) {
                alert(`Conta criada com sucesso! Bem-vindo(a), ${nome}!`);
                window.location.href = "../index.html";
            } else {
                alert('Erro ao criar conta. Tente novamente.');
                btn.disabled = false;
                btn.textContent = "Criar Minha Conta no Ateliê";
            }
        });
    </script>
</body>
</html>
